<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferry Schedule</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8fafc;
            color: #333;
            margin: 40px;
        }

        h1 {
            color: #1e293b;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #ffffff;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background-color: #0f172a;
            color: #ffffff;
            font-weight: 600;
        }

        tr:hover {
            background-color: #f1f5f9;
        }

        .no-data {
            text-align: center;
            color: #64748b;
            font-style: italic;
        }
    </style>
</head>
<body>

    <h1>Ferry Timetable</h1>

    <table>
        <thead>
            <tr>
                <!-- Adjust header titles to match your CSV column headers -->
                <th>Route</th>
                <th>Departure Time</th>
                <th>Arrival Time</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            {% if data %}
                {% for ferries in data %}
                    <tr>
                        <!-- Replace key names inside ['...'] with your exact CSV column names -->
                        <td>{{ ferries['Route'] }}</td>
                        <td>{{ ferries['Departure'] }}</td>
                        <td>{{ ferries['Arrival'] }}</td>
                        <td>{{ ferries['Status'] }}</td>
                    </tr>
                {% endfor %}
            {% else %}
                <tr>
                    <td colspan="4" class="no-data">No ferry schedules available.</td>
                </tr>
            {% endif %}
        </tbody>
    </table>

</body>
</html>
